name: Demonstrator checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,notebook]'
      - name: Generate synthetic fixtures and a locally trained model
        run: |
          d2t synth --n 1200 --seed 42 --output data/synthetic.jsonl
          d2t experiment --data data/synthetic.jsonl --output results/latest --seed 42 --bootstrap 20
      - run: python -m pytest -q
      - run: python -m pip check
      - name: Build demo container
        run: docker build -t controlled-d2t:ci .
      - name: Check container startup
        shell: bash
        run: |
          docker run -d --name d2t-ci -p 8501:8501 controlled-d2t:ci
          trap 'docker logs d2t-ci; docker rm -f d2t-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
